name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SWIFT_SNAPSHOT: swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-07-23-a
  SWIFT_COMPILER_COMMIT: ef761e567dc94ee
  TOOLCHAINS: org.swift.64202607231a
  STANDARD_WASM_SDK: swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-07-23-a_wasm
  EMBEDDED_WASM_SDK: swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-07-23-a_wasm-embedded

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Swift toolchain
        run: |
          set -euo pipefail
          toolchain="$HOME/Library/Developer/Toolchains/${SWIFT_SNAPSHOT}.xctoolchain"
          if [[ ! -d "$toolchain" ]]; then
            package="$RUNNER_TEMP/${SWIFT_SNAPSHOT}-osx.pkg"
            curl -fsSL --retry 3 \
              "https://download.swift.org/swift-6.4.x-branch/xcode/${SWIFT_SNAPSHOT}/${SWIFT_SNAPSHOT}-osx.pkg" \
              -o "$package"
            installer -pkg "$package" -target CurrentUserHomeDirectory
          fi
          xcrun swiftc --version | tee "$RUNNER_TEMP/swift-version.txt"
          grep -F "Swift ${SWIFT_COMPILER_COMMIT}" "$RUNNER_TEMP/swift-version.txt"

      - name: Build test bundle with Xcode
        run: |
          set -euo pipefail
          python3 -c \
            'import subprocess,sys; sys.exit(subprocess.run(sys.argv[2:], timeout=int(sys.argv[1])).returncode)' \
            120 xcodebuild build-for-testing \
              -toolchain "$TOOLCHAINS" \
              -scheme swift-webrtc-Package \
              -destination 'platform=macOS' \
              -parallel-testing-enabled NO \
              'LD_RUNPATH_SEARCH_PATHS=$(inherited) /Users/runner/Library/Developer/Toolchains/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-07-23-a.xctoolchain/usr/lib/swift/macosx/testing'

      - name: Test portable protocol targets
        run: |
          set -euo pipefail
          python3 -c \
            'import subprocess,sys; sys.exit(subprocess.run(sys.argv[2:], timeout=int(sys.argv[1])).returncode)' \
            120 xcodebuild test-without-building \
              -toolchain "$TOOLCHAINS" \
              -scheme swift-webrtc-Package \
              -destination 'platform=macOS' \
              -parallel-testing-enabled NO \
              -only-testing:RTPWireCoreTests \
              -only-testing:H264ByteStreamCoreTests \
              -only-testing:H264RTPPayloadCoreTests \
              -only-testing:H264RTPTests \
              -only-testing:H264RTPSenderTests \
              -only-testing:H264RTPReceiverTests \
              -only-testing:SRTPCoreTests \
              -only-testing:STUNCoreTests \
              -only-testing:ICELiteTests \
              -only-testing:ICELiteCoreTests \
              -only-testing:SCTPCoreTests \
              -only-testing:DataChannelTests \
              'LD_RUNPATH_SEARCH_PATHS=$(inherited) /Users/runner/Library/Developer/Toolchains/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-07-23-a.xctoolchain/usr/lib/swift/macosx/testing'

      - name: Test long WebRTC integration suites
        run: |
          set -euo pipefail
          python3 -c \
            'import subprocess,sys; sys.exit(subprocess.run(sys.argv[2:], timeout=int(sys.argv[1])).returncode)' \
            120 xcodebuild test-without-building \
              -toolchain "$TOOLCHAINS" \
              -scheme swift-webrtc-Package \
              -destination 'platform=macOS' \
              -parallel-testing-enabled NO \
              -only-testing:WebRTCTests/WebRTCLoopbackTests \
              -only-testing:WebRTCTests/WebRTCMediaIntegrationTests \
              -only-testing:WebRTCTests/WebRTCListenerTests \
              'LD_RUNPATH_SEARCH_PATHS=$(inherited) /Users/runner/Library/Developer/Toolchains/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-07-23-a.xctoolchain/usr/lib/swift/macosx/testing'

      - name: Test remaining WebRTC facade suites
        run: |
          set -euo pipefail
          python3 -c \
            'import subprocess,sys; sys.exit(subprocess.run(sys.argv[2:], timeout=int(sys.argv[1])).returncode)' \
            120 xcodebuild test-without-building \
              -toolchain "$TOOLCHAINS" \
              -scheme swift-webrtc-Package \
              -destination 'platform=macOS' \
              -parallel-testing-enabled NO \
              -only-testing:WebRTCTests/WebRTCCertificateTests \
              -only-testing:WebRTCTests/WebRTCConnectionDemultiplexTests \
              -only-testing:WebRTCTests/WebRTCConnectionDataChannelEventTests \
              -only-testing:WebRTCTests/WebRTCDTLSRetransmissionTests \
              -only-testing:WebRTCTests/WebRTCTimerTests \
              -only-testing:WebRTCTests/STUNBindingTransactionTests \
              -only-testing:WebRTCTests/WebRTCMediaConfigurationTests \
              -only-testing:WebRTCTests/DTLSEndpointTests \
              -only-testing:WebRTCTests/WebRTCSessionDescriptionTests \
              -only-testing:WebRTCTests/CertificateFingerprintTests \
              -only-testing:WebRTCTests/WebRTCTrickleICECandidateTests \
              -only-testing:WebRTCTests/WebRTCEndpointTests \
              -only-testing:WebRTCTests/WebRTCConnectionTests \
              'LD_RUNPATH_SEARCH_PATHS=$(inherited) /Users/runner/Library/Developer/Toolchains/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-07-23-a.xctoolchain/usr/lib/swift/macosx/testing'

  wasm:
    name: Standard and Embedded WebAssembly probes
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Swift toolchain
        run: |
          set -euo pipefail
          toolchain="$HOME/Library/Developer/Toolchains/${SWIFT_SNAPSHOT}.xctoolchain"
          if [[ ! -d "$toolchain" ]]; then
            package="$RUNNER_TEMP/${SWIFT_SNAPSHOT}-osx.pkg"
            curl -fsSL --retry 3 \
              "https://download.swift.org/swift-6.4.x-branch/xcode/${SWIFT_SNAPSHOT}/${SWIFT_SNAPSHOT}-osx.pkg" \
              -o "$package"
            installer -pkg "$package" -target CurrentUserHomeDirectory
          fi
          xcrun swiftc --version | tee "$RUNNER_TEMP/swift-version.txt"
          grep -F "Swift ${SWIFT_COMPILER_COMMIT}" "$RUNNER_TEMP/swift-version.txt"

      - name: Install matching WebAssembly SDK
        run: |
          set -euo pipefail
          metadata="$(curl -fsSL --retry 3 https://www.swift.org/api/v1/install/dev/6.4.x/wasm-sdk.json)"
          entry="$(jq -cer --arg snapshot "$SWIFT_SNAPSHOT" '.[] | select(.dir == $snapshot)' <<< "$metadata")"
          download="$(jq -er '.download' <<< "$entry")"
          checksum="$(jq -er '.checksum' <<< "$entry")"
          sdk_url="https://download.swift.org/swift-6.4.x-branch/wasm-sdk/${SWIFT_SNAPSHOT}/${download}"
          xcrun swift sdk install \
            --swift-sdks-path "$RUNNER_TEMP/swift-sdks" \
            "$sdk_url" \
            --checksum "$checksum"
          echo "SWIFT_SDKS_PATH=$RUNNER_TEMP/swift-sdks" >> "$GITHUB_ENV"

      - name: Build standard WebAssembly integration probe
        run: |
          set -euo pipefail
          SWIFT_NETWORKING_WASM=1 xcrun swift build \
            --swift-sdks-path "$SWIFT_SDKS_PATH" \
            --swift-sdk "$STANDARD_WASM_SDK" \
            --build-system swiftbuild \
            --scratch-path "$RUNNER_TEMP/swift-webrtc-wasm" \
            -c release \
            --product WebRTCPlatformIntegrationProbe

      - name: Run standard WebAssembly integration probe
        run: |
          set -euo pipefail
          python3 -c \
            'import subprocess,sys; sys.exit(subprocess.run(sys.argv[2:], timeout=int(sys.argv[1])).returncode)' \
            120 env SWIFT_NETWORKING_WASM=1 xcrun swift run \
              --swift-sdks-path "$SWIFT_SDKS_PATH" \
              --swift-sdk "$STANDARD_WASM_SDK" \
              --build-system swiftbuild \
              --scratch-path "$RUNNER_TEMP/swift-webrtc-wasm" \
              -c release \
              --skip-build \
              WebRTCPlatformIntegrationProbe

      - name: Build Embedded WebAssembly integration probe
        run: |
          set -euo pipefail
          SWIFT_NETWORKING_EMBEDDED=1 xcrun swift build \
            --swift-sdks-path "$SWIFT_SDKS_PATH" \
            --swift-sdk "$EMBEDDED_WASM_SDK" \
            --build-system swiftbuild \
            --scratch-path "$RUNNER_TEMP/swift-webrtc-embedded" \
            -c release \
            -debug-info-format none \
            --product WebRTCPlatformIntegrationProbe

      - name: Run Embedded WebAssembly integration probe
        run: |
          set -euo pipefail
          python3 -c \
            'import subprocess,sys; sys.exit(subprocess.run(sys.argv[2:], timeout=int(sys.argv[1])).returncode)' \
            120 env SWIFT_NETWORKING_EMBEDDED=1 xcrun swift run \
              --swift-sdks-path "$SWIFT_SDKS_PATH" \
              --swift-sdk "$EMBEDDED_WASM_SDK" \
              --build-system swiftbuild \
              --scratch-path "$RUNNER_TEMP/swift-webrtc-embedded" \
              -c release \
              -debug-info-format none \
              --skip-build \
              WebRTCPlatformIntegrationProbe
